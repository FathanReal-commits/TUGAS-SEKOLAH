<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flux 900.</title>

    <!-- CSS -->
    <link rel="stylesheet" href="Style/Style.css">
</head>

<body>
    <nav class="navbar">

        <h1>Visualflow®</h1>
        <p>System setup Assistant</p>

    </nav>
    <main class="container">


        <!-- Website title -->



        <!-- Main question card -->
        <section class="card">

            <h2 id="question">
                Loading...
            </h2>


            <!-- YES / NO buttons -->
            <div class="buttons">

                <button id="yesButton">

                    YES
                </button>

                <button id="noButton">
                    NO
                </button>

            </div>
            <div id="nasaEyes" style="display: none;">
                <iframe src="https://eyes.nasa.gov/apps/solar-system/#/81p_wild_2?logo=false&lighting=natural"
                    allowfullscreen></iframe>
            </div>
            <div id="nasaEyes" style="display: none;">
                <iframe
                    src="https://eyes.nasa.gov/apps/solar-system/#/243_ida?logo=false&surfaceMapTiling=true&hd=true&lighting=natural"
                    allowfullscreen></iframe>
            </div>

            <video id="Q1" width="640" height="360" style="display: none;" autoplay muted loop controls>
                <source src="/assets/Q1.webm" type="video/webm">
            </video>


            <!-- Result -->
            <div id="result"></div>


            <!-- Restart -->
            <button id="restartButton">
                RESTART
            </button>

        </section>

        <hr>
        <!-- Optional information -->
        <footer>
            <p>Visualflow | System setup Assistant</p>
        </footer>

    </main>


    <!-- JavaScript -->
    <script src="JS/script.js"></script>

</body>

</html>
